{% extends "admin_base.html" %}
{% load static %}

{% block admin_content %}
    <!-- Link do CSS agora dentro do bloco para garantir que carregue -->
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">

    <h2>Cadastrar Novo Produto</h2>
    <div style="background: #f8f9fa; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #ddd;">
        <!-- No seu arquivo admin_produto_form.html -->

            <form method="POST" enctype="multipart/form-data"> <!-- MUITO IMPORTANTE: enctype -->
                {% csrf_token %}
                
                {% for field in form %}
                    <div style="margin-bottom: 15px;">
                        <label>{{ field.label }}</label>
                        {{ field }}
                    </div>
                {% endfor %}

                <!-- NOVO CAMPO PARA MÚLTIPLAS IMAGENS -->
                <div style="margin-top: 20px; padding: 20px; border: 2px dashed #198754; border-radius: 10px; background: #f9f9f9;">
                    <label style="font-weight: bold; color: #198754; display: block; margin-bottom: 10px;">
                        📸 Adicionar Fotos Extras à Galeria:
                    </label>
                    <input type="file" name="mais_imagens" multiple class="form-control">
                    <p style="font-size: 0.8rem; color: #666; margin-top: 10px;">
                        Dica: Segure <strong>Ctrl</strong> (ou Command no Mac) para selecionar várias fotos de uma vez.
                    </p>
                </div>

                <button type="submit" class="btn-verde" style="width: 100%; margin-top: 30px; padding: 15px;">
                    CADASTRAR PRODUTO
                </button>
            </form>
    </div>

    <!-- Script para garantir bordas visíveis mesmo que o CSS falhe -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const inputs = document.querySelectorAll('#produto-form input, #produto-form textarea, #produto-form select');
            inputs.forEach(el => {
                el.style.border = "2px solid #888"; // Força borda cinza escura
                el.style.padding = "10px";
                el.style.borderRadius = "5px";
                el.style.width = "100%";
                
                el.addEventListener('focus', () => el.style.borderColor = "#198754");
                el.addEventListener('blur', () => el.style.borderColor = "#888");
            });
        });
    </script>
{% endblock %}
