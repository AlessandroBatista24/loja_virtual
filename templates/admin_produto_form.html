{% extends "admin_base.html" %}

{% block admin_content %}
    <h2>Cadastrar Novo Produto</h2>
    <div style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <!-- O Django renderiza os campos automaticamente aqui -->
            {% for field in form %}
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px;">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn-verde" style="width: 100%; padding: 15px; border: none; cursor: pointer;">
                SALVAR PRODUTO
            </button>
        </form>
    </div>
{% endblock %}
