{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- 1. Define os acentos (ç, á, õ) corretamente -->
    <meta charset="UTF-8">

    <!-- 2. Faz o site abrir corretamente no celular (Responsividade) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 3. Melhora a compatibilidade com navegadores antigos da Microsoft -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>{% block title%}{% endblock %}</title>
    <link rel ="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="menu">
      <a href="{% url 'lojaapp:home' %}">Home</a>        
      <a href="{% url 'lojaapp:todos-produtos' %}">Categorias</a>
      <a href="{% url 'lojaapp:contato' %}">Contato</a>
      <a href="{% url 'lojaapp:sobre' %}">Sobre</a> 
      <a href="{% url 'lojaapp:carrinho' %}"> Meu Carrinho</a>

      <hr> 
             
    </div>     
   
    {% block content %}
    {% endblock content %}
</body>
</html>
