{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    
    <!-- Link para o arquivo CSS centralizado -->
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
</head>
<body>

    <header class="header-verde">
        <div class="topo">
            <div class="logo">MINHA LOJA</div>
            
            <nav class="nav-links">
                <!-- Links de Navegação Fixos -->
                <a href="{% url 'lojaapp:home' %}">Home</a>
                <a href="{% url 'lojaapp:todos-produtos' %}">Categorias</a>
                <a href="{% url 'lojaapp:contato' %}">Contato</a>
                <a href="{% url 'lojaapp:sobre' %}">Sobre</a>
                
                <!-- Lógica de Autenticação (Aparece conforme o status do usuário) -->
                {% if request.user.is_authenticated %}
                    <span style="color: #ffc107; font-weight: bold; margin-left: 15px; font-size: 13px;">
                        OLÁ, {{ request.user.username|upper }}
                    </span>
                    <a href="{% url 'lojaapp:clientelogout' %}" style="color: #ffc107; font-size: 11px; margin-left: 5px;">(SAIR)</a>
                {% else %}
                    <a href="{% url 'lojaapp:clientelogin' %}" style="border: 1px solid white; padding: 5px 10px; border-radius: 5px; margin-left: 15px;">Login</a>
                    <a href="{% url 'lojaapp:clienteregistro' %}">Cadastrar</a>
                {% endif %}
                
                <!-- Botão de Carrinho com destaque -->
                <a class="btn-carrinho" href="{% url 'lojaapp:carrinho' %}" style="margin-left: 20px;">🛒 Carrinho</a>
            </nav>
        </div>

        <!-- Campo de Busca Centralizado -->
        <div class="busca-container">
            <form action="{% url 'lojaapp:home' %}" method="GET" class="busca-form">
                <input type="text" name="q" placeholder="O QUE VOCÊ PROCURA HOJE?">
                <button type="submit">BUSCAR</button>
            </form>
        </div>
    </header>

    <!-- Conteúdo Principal Dinâmico -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
