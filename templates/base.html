{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- 1. Define os acentos (ç, á, õ) corretamente -->
    <meta charset="UTF-8">

    <!-- 2. Faz o site abrir corretamente no celular (Responsividade) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 3. Melhora a compatibilidade com navegadores antigos da Microsoft -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>{% block title%}{% endblock %}</title>
    <link rel ="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom mb-4">
    <div class="container-fluid">
        <div class="d-flex gap-2 align-items-center">
            <!-- Botão Home Verde -->
            <a class="nav-link px-2" href="{% url 'lojaapp:home' %}">Home</a>
            
            <!-- Links simples -->
            <a class="nav-link px-2" href="{% url 'lojaapp:todos-produtos' %}">Categorias</a>
            <a class="nav-link px-2" href="{% url 'lojaapp:contato' %}">Contato</a>
            <a class="nav-link px-2" href="{% url 'lojaapp:sobre' %}">Sobre</a>
            
            <!-- Botão de Carrinho com destaque -->
            <a class="btn btn-sm btn-outline-success ms-2" href="{% url 'lojaapp:carrinho' %}">
                🛒 Meu Carrinho
            </a>

        </div>
    </div>
</nav>
    
   
    {% block content %}
    {% endblock content %}
</body>
</html>
