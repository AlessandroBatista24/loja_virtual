{% extends "base.html" %}
{% load static %}
{% block content %}
<!-- BANNER -->
<div id="bannerHome" style="position: relative; overflow: hidden; height: 400px; background: #000;">
    <div id="trilho" style="display: flex; transition: transform 0.8s ease; height: 100%;">
        {% for banner in banners %}
            <div style="min-width: 100vw; height: 400px;">
                <img src="{{ banner.imagem.url }}" style="width: 100vw; height: 400px; object-fit: cover;">
            </div>
        {% endfor %}
    </div>
    <div onclick="mudarSlide(-1)" style="position: absolute; left: 30px; top: 50%; transform: translateY(-50%); cursor: pointer; background: rgba(0,0,0,0.5); color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 24px; border: 1px solid white;">❮</div>
    <div onclick="mudarSlide(1)" style="position: absolute; right: 30px; top: 50%; transform: translateY(-50%); cursor: pointer; background: rgba(0,0,0,0.5); color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 24px; border: 2px solid white;">❯</div>
</div>

<script>
    let c = 0; const t = document.getElementById('trilho'); const n = {{ banners.count|default:0 }};
    function mudarSlide(d) { if (n <= 1) return; c = (c + d + n) % n; t.style.transform = `translateX(${-c * 100}vw)`; }
    if (n > 1) { setInterval(() => mudarSlide(1), 7000); }
</script>

<!-- VITRINE -->
<div class="container" style="margin-top: 40px;">
    <h2 style="margin-left: 10px; margin-bottom: 20px;">Produtos em Destaque</h2>
    <div class="row">
        {% for p in produto_list %}
        <div class="card">
            <a href="{% url 'lojaapp:produtodetalhe' p.slug %}">
                <img src="{{ p.image.url }}" alt="{{ p.titulo }}">
            </a>
            <h4 style="font-size: 16px; margin: 10px 0;">{{ p.titulo }}</h4>
            <h3 style="color: #198754; font-size: 20px;">R$ {{ p.venda }}</h3>
            <div class="acoes">
                <a href="{% url 'lojaapp:produtodetalhe' p.slug %}" class="btn-detalhes">Detalhes</a>
                <a href="{% url 'lojaapp:addcarrinho' p.id %}" class="btn-verde">Comprar</a>
            </div>
        </div>  
        {% endfor %}
    </div>
</div>
{% endblock %}
