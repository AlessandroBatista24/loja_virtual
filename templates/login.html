{% extends "base.html" %}
{% block title %}Entrar{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 50px auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #198754; text-transform: uppercase; margin-bottom: 30px;">Acessar Conta</h2>
    
    {% if erro %}
        <p style="color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 5px; text-align: center; font-size: 0.9rem;">
            {{ erro }}
        </p>
    {% endif %}

    <form action="" method="POST">
        {% csrf_token %}
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: bold; margin-bottom: 8px;">Usuário:</label>
            <input type="text" name="username" required placeholder="Seu nome de usuário" 
                   style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 25px;">
            <label style="display: block; font-weight: bold; margin-bottom: 8px;">Senha:</label>
            <input type="password" name="password" required placeholder="Digite sua senha" 
                   style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
        </div>

        <button type="submit" class="btn-verde" style="width: 100%; padding: 15px; border: none; cursor: pointer; font-size: 1rem; text-transform: uppercase;">
            Entrar
        </button>

        <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: #666;">
            Ainda não tem conta? <a href="{% url 'lojaapp:clienteregistro' %}" style="color: #198754; font-weight: bold; text-decoration: none;">Cadastre-se aqui</a>
        </p>
    </form>
</div>
{% endblock %}
